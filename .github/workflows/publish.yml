name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run (skip actual publish)"
        type: boolean
        default: false
      force-latest:
        description: "Force publish as latest (overrides version-based tag)"
        type: boolean
        default: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"
      - uses: actions/setup-node@v4
        with:
          # Node 24 bundles npm >= 11.5.1, the floor for OIDC trusted publishing.
          node-version: "24"
          # Targets the publish at npm. Auth is OIDC trusted publishing (configured
          # on npmjs.com for this repo + publish.yml) — no NODE_AUTH_TOKEN needed.
          registry-url: "https://registry.npmjs.org"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Assert bundled npm supports OIDC trusted publishing
        # Read-only, fails closed: trusted publishing needs npm >= 11.5.1. Node 24
        # bundles it, but this guards against a node-version regression.
        run: |
          MIN=11.5.1
          CUR="$(npm --version)"
          if [ "$(printf '%s\n%s\n' "$MIN" "$CUR" | sort -V | head -n1)" != "$MIN" ]; then
            echo "::error::npm ${CUR} < ${MIN} (OIDC trusted publishing needs >= ${MIN}); bump node-version"
            exit 1
          fi
      - name: Determine npm dist-tag
        id: dist-tag
        run: |
          if [[ "${{ inputs.force-latest }}" == "true" ]]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(node -p "require('./package.json').version")
            if [[ "$VERSION" == *-alpha* ]]; then
              echo "tag=alpha" >> "$GITHUB_OUTPUT"
            elif [[ "$VERSION" == *-beta* ]]; then
              echo "tag=beta" >> "$GITHUB_OUTPUT"
            elif [[ "$VERSION" == *-rc* ]]; then
              echo "tag=next" >> "$GITHUB_OUTPUT"
            else
              echo "tag=latest" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Publish to npm (OIDC trusted publishing)
        if: ${{ !inputs.dry-run }}
        # No NODE_AUTH_TOKEN: auth is OIDC via the npm trusted publisher, which
        # also attaches provenance automatically (no --provenance flag required).
        run: npm publish --tag ${{ steps.dist-tag.outputs.tag }}
      - name: Dry run
        if: ${{ inputs.dry-run }}
        run: npm publish --dry-run --tag ${{ steps.dist-tag.outputs.tag }}
